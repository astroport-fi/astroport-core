[package]
name = "astroport-pair-exit-only"
version = "1.0.0"
authors = ["Astroport"]
edition = "2021"
description = "Code an Astroport pair migrates to when it must only allow balanced withdrawals"
license = "GPL-3.0-only"
repository = "https://github.com/astroport-fi/astroport"
homepage = "https://astroport.fi"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
astroport.workspace = true
cosmwasm-std = { workspace = true, features = ["cosmwasm_1_1", "stargate"] }
cosmwasm-schema.workspace = true
cw-storage-plus.workspace = true
cw2.workspace = true
cw20 = "1.1"
cw-utils.workspace = true
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
anyhow = "1"
cw20-base = { version = "1.1", features = ["library"] }
astroport-test = { path = "../../packages/astroport_test" }
astroport-factory = { path = "../factory" }
astroport-pair-concentrated = { path = "../pair_concentrated" }
astroport-native-coin-registry = { path = "../periphery/native_coin_registry" }
astroport-tokenfactory-tracker = { path = "../periphery/tokenfactory_tracker" }
