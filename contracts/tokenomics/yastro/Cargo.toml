[package]
name = "astroport-yastro"
version = "1.0.0"
authors = ["Astroport"]
edition = "2021"
description = "yASTRO: stake ASTRO for a transferable CW20 that earns protocol fees, with a 7-day unbonding"
license = "GPL-3.0-only"
repository = "https://github.com/astroport-fi/astroport"
homepage = "https://astroport.fi"

exclude = [
    # Those files are rust-optimizer artifacts. You might want to commit them for convenience but they should not be part of the source code publication.
    "contract.wasm",
    "hash.txt",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# for more explicit tests, cargo test --features=backtraces
backtraces = ["cosmwasm-std/backtraces"]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-schema.workspace = true
cosmwasm-std.workspace = true
cw-storage-plus.workspace = true
cw2.workspace = true
cw-utils.workspace = true
thiserror.workspace = true
astroport.workspace = true
cw20 = "1.1"
cw20-base = { version = "1.1", features = ["library"] }

[dev-dependencies]
astroport-test = { path = "../../../packages/astroport_test" }
anyhow = "1"
